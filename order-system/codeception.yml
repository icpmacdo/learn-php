namespace: App\Tests
support_namespace: Support
paths:
    tests: tests
    output: tests/_output
    data: tests/Support/Data
    support: tests/Support
    envs: tests/_envs
actor_suffix: Tester
settings:
    # Resolved per suite dir (tests/<Suite>/_bootstrap.php); each just
    # requires tests/_bootstrap.php, which loads vendor/autoload.php and the
    # .env files with APP_ENV forced to test.
    bootstrap: _bootstrap.php
extensions:
    enabled:
        - Codeception\Extension\RunFailed
