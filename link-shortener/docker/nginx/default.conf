# nginx site config: serve the Symfony front controller via php-fpm.
#
# Every request that is not an existing file is rewritten to public/index.php,
# which is the single entry point of the Symfony app.
server {
    listen 80;
    server_name localhost;
    root /app/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Never execute any other .php file.
    location ~ \.php$ {
        return 404;
    }
}
