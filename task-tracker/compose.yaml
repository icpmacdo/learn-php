# Part 2 -- team task tracker API. Four services, nothing installed on the host.
#
#   docker compose up -d --wait  -> working API on http://localhost:8081
#   docker compose exec php ...  -> composer / console / codecept commands
#
# Part 1 owns 8080; this project owns 8081 (and Jenkins, later, 8082).
name: task-tracker

services:
  php:
    build:
      context: docker/php
    # Explicit image name (instead of the derived <project>-php) so the
    # Jenkins pipeline can run one-off containers from the exact same image:
    # CI and dev share a single runtime, no toolchain drift.
    image: task-tracker-php
    volumes:
      # Bind-mount the whole app for the dev loop: edit on the host,
      # php-fpm picks the change up on the next request.
      - ./:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "app-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      # Generous: the entrypoint waits for MySQL and runs migrations first.
      start_period: 60s

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx only needs the public/ dir (and only to check file existence);
      # every PHP request is proxied to php:9000.
      - ./public:/app/public:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/login || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8
    # Deliberately NOT published to the host -- only containers can reach it.
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP, so this stays "unhealthy" during the
      # init phase (the temp init server is socket-only).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uapp -papp --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    # Deliberately NOT published, and no persistence config: everything Redis
    # holds here (cache entries, rate-limiter counters -- stage 2) is
    # disposable derived state that the app can rebuild from MySQL.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
